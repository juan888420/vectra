<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vectra</title>
    <script>
      // Blocking, runs before any stylesheet/React paints, so the correct
      // theme applies on the very first frame (no flash of the wrong theme).
      // Keep the storage key in sync with THEME_STORAGE_KEY in
      // packages/ui/src/theme/ThemeProvider.tsx.
      (function () {
        var stored = localStorage.getItem("vectra-theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
